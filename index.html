<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Rabbit Hole</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=JetBrains+Mono:wght@400&display=swap">
  <!-- Omnium from Adobe Fonts -->
  <link rel="stylesheet" href="https://use.typekit.net/vmk7qex.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- BACKGROUND VIDEO
       1. Put your video in the "media" folder and name it background.mp4
       2. Remove the comment marks at the start and end of the line below. -->
  <!-- <video class="bg-video" src="media/background.mp4" autoplay muted loop playsinline></video> -->

  <canvas id="space" aria-hidden="true"></canvas>

  <main id="viewport" aria-label="The rabbit hole">
    <div id="world">
      <svg id="wires" aria-hidden="true"></svg>
      <div id="nodes"></div>
    </div>
  </main>

  <div class="vignette" aria-hidden="true"></div>

  <header class="hud-top">
    <span class="brand">THE RABBIT HOLE</span>
    <span id="clock" class="clock"></span>
  </header>

  <section id="welcome">
    <h1 id="welcome-title">WELCOME</h1>
    <button id="enter" class="pill" type="button">Go down the rabbit hole</button>
    <p id="star-count" class="star-count" hidden>
      <span id="star-count-text"></span>
      <button id="reset-stars" class="reset" type="button">Reset</button>
    </p>
  </section>

  <footer id="hud-bottom">
    <nav id="trail" class="trail" aria-label="Your path"></nav>
    <div class="readout-box">
      <span id="readout"></span>
      <span class="hint">Drag to look around · scroll to zoom</span>
    </div>
    <div class="controls">
      <button id="back" class="ctl" type="button">← Back</button>
      <button id="center" class="ctl" type="button">Center</button>
      <button id="surface" class="ctl" type="button">Surface</button>
    </div>
  </footer>

  <script src="paths.js"></script>
  <script src="stars.js"></script>
  <script src="engine.js"></script>
</body>
</html>
